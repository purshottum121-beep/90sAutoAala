<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bus Wala</title>
  
  <!-- Google Fonts: Baloo 2, Yatra One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Yatra+One&display=swap" rel="stylesheet">
  
  <style>
    /* ───────────────────────────────────────────────────────────── 90s Bus Wala
       The artwork carries all the colour. Everything the app draws
       on top is neutral glass, so it sits on any background image.
       ───────────────────────────────────────────────────────────── */

    :root {
      --logo-x: 0vw;
      --logo-top: 13vh;
      --logo-size: clamp(2.5rem, 8.5vw, 7rem);

      --edge: clamp(1rem, 2.2vw, 1.75rem);
      --glass: rgba(255, 255, 255, 0.1);
      --glass-line: rgba(255, 255, 255, 0.2);
      --shadow-glass: 0 8px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      --text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);

      --body: "Baloo 2", "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari",
        ui-rounded, system-ui, sans-serif;
      --ui: ui-sans-serif, -apple-system, "Segoe UI Variable Text", "Segoe UI",
        system-ui, sans-serif;

      --swift: 140ms cubic-bezier(0.4, 0, 0.2, 1);
      --glide: 320ms cubic-bezier(0.4, 0, 0.2, 1);
      --settle: 620ms cubic-bezier(0.16, 1, 0.3, 1);
      --ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--body);
      color: #fff;
      background: #0a1416;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    @keyframes rise {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: none; }
    }

    @keyframes rise-left {
      from { opacity: 0; transform: translate3d(-16px, 0, 0); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .topbar,
    .logo,
    .dock {
      animation: rise var(--settle) both;
    }
    .topbar { animation-delay: 0.28s; }
    .logo { animation-delay: 0.06s; }
    .dock { animation-delay: 0.16s; }

    .horns {
      animation: rise-left var(--settle) 0.34s both;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #0a1416;
    }

    .bg__layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      transition: opacity 1.1s var(--ease-settle);
    }

    .bg__layer.is-active {
      opacity: 1;
    }

    /* 10 Background Images CSS */
    .bg__layer--1 {
      background-image: url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--2 {
      background-image: url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--3 {
      background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--4 {
      background-image: url("https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--5 {
      background-image: url("https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--6 {
      background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--7 {
      background-image: url("https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--8 {
      background-image: url("https://images.unsplash.com/photo-1426604966848-d7adac902bff?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--9 {
      background-image: url("https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1600&auto=format&fit=crop");
    }
    .bg__layer--10 {
      background-image: url("https://images.unsplash.com/photo-1454496522488-7a8e488e8606?q=80&w=1600&auto=format&fit=crop");
    }

    .bg__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.28) 0%,
        rgba(0, 0, 0, 0.06) 26%,
        rgba(0, 0, 0, 0.1) 58%,
        rgba(0, 0, 0, 0.48) 100%
      );
      pointer-events: none;
    }

    .yt-host {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(var(--edge), env(safe-area-inset-top)) var(--edge)
        max(var(--edge), env(safe-area-inset-bottom));
    }

    .topbar {
      position: fixed;
      top: max(1.15rem, env(safe-area-inset-top));
      left: var(--edge);
      right: var(--edge);
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      text-shadow: var(--text-shadow);
    }

    .clock {
      justify-self: start;
      font-family: var(--ui);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.92);
    }

    .presence {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--ui);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.92);
    }

    .presence__dot {
      position: relative;
      width: 10px;
      height: 10px;
      flex: none;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.9);
    }

    .presence__dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #4ade80;
      opacity: 0.75;
      animation: ping 1.9s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .presence__count {
      font-variant-numeric: tabular-nums;
    }

    .presence__label {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.62);
    }

    @keyframes ping {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .horns {
      position: fixed;
      left: var(--edge);
      top: 50%;
      translate: 0 -50%;
      z-index: 20;
    }

    .horn {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0.7rem 0.28rem 0.3rem;
      border: 1px solid var(--glass-line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      color: #fff;
      font-family: var(--body);
      cursor: pointer;
      transition: background var(--swift), transform var(--swift),
        border-color var(--swift);
    }

    .horn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .horn:active {
      transform: scale(0.95);
    }

    .horn.is-blaring {
      animation: honk 0.45s ease;
    }

    .horn__icon {
      display: grid;
      place-items: center;
      width: 1.6rem;
      height: 1.6rem;
      flex: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .horn__icon svg {
      width: 15px;
      height: 15px;
    }

    .horn.is-blaring .horn__icon {
      background: #fff;
      color: #111;
    }

    .horn__text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      text-align: left;
    }

    .horn__deva {
      font-size: 0.76rem;
      font-weight: 700;
    }

    .horn__en {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.62);
    }

    @keyframes honk {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1.6deg); }
      50% { transform: translateX(5px) rotate(1.6deg); }
      75% { transform: translateX(-2px); }
    }

    .links {
      justify-self: end;
      display: flex;
      align-items: center;
    }

    .link {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      transition: background var(--swift), transform var(--swift), color var(--swift);
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .link:active {
      transform: scale(0.95);
    }

    .logo {
      margin: var(--logo-top) 0 0;
      translate: var(--logo-x) 0;
      display: flex;
      align-items: baseline;
      gap: 0.22em;
      font-family: var(--body);
      font-weight: 800;
      font-size: var(--logo-size);
      line-height: 1;
      letter-spacing: -0.01em;
      color: #fff;
      text-align: center;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.5));
      user-select: none;
    }

    @keyframes truck-shake {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      8% { transform: translate3d(-4px, 2px, 0) rotate(-1.1deg); }
      18% { transform: translate3d(4px, -2px, 0) rotate(0.9deg); }
      28% { transform: translate3d(-3px, 1px, 0) rotate(-0.75deg); }
      38% { transform: translate3d(3px, -1px, 0) rotate(0.6deg); }
      50% { transform: translate3d(-2px, 1px, 0) rotate(-0.45deg); }
      62% { transform: translate3d(2px, 0, 0) rotate(0.3deg); }
      74% { transform: translate3d(-1px, 0, 0) rotate(-0.18deg); }
      86% { transform: translate3d(1px, 0, 0) rotate(0.08deg); }
      100% { transform: none; }
    }

    .logo.is-shaking .logo__line {
      animation: truck-shake 720ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .dock {
      position: relative;
      width: 100%;
      max-width: 30rem;
      margin-bottom: clamp(0.5rem, 7vh, 4.5rem);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.4rem 0.9rem 0.4rem 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--glass-line);
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      box-shadow: var(--shadow-glass);
    }

    .disc {
      position: relative;
      width: 3.25rem;
      height: 3.25rem;
      flex: none;
    }

    .disc__ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      outline: 1px solid rgba(255, 255, 255, 0.2);
      outline-offset: -1px;
      background: #1a1a1a;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }

    .player.is-playing .disc__ring {
      animation-play-state: running;
    }

    .disc__art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .disc__art.is-letterboxed {
      transform: scale(1.35);
    }

    .disc__hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.5rem;
      height: 0.5rem;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .meta__title,
    .meta__artist {
      transition: opacity 220ms ease;
    }

    .player.is-swapping .meta__title,
    .player.is-swapping .meta__artist {
      opacity: 0;
    }

    .disc {
      transition: transform var(--glide);
    }

    .player.is-playing .disc {
      transform: scale(1.03);
    }

    .meta__title {
      margin: 0;
      font-weight: 700;
      font-size: 0.84rem;
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta__artist {
      margin: 0;
      font-size: 0.71rem;
      font-weight: 600;
      line-height: 1.25;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seek {
      position: relative;
      height: 10px;
      margin-top: 0.2rem;
      cursor: pointer;
      touch-action: none;
    }

    .seek__rail {
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 3px;
      transform: translateY(-50%);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.2);
    }

    .seek__fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    .seek__knob {
      position: absolute;
      top: 50%;
      left: 0;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity var(--swift);
      will-change: transform;
    }

    .seek:hover .seek__knob,
    .seek:focus-visible .seek__knob {
      opacity: 1;
    }

    .time {
      margin-top: 0.05rem;
      font-size: 0.62rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.6);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex: none;
    }

    .btn {
      display: grid;
      place-items: center;
      width: 1.8rem;
      height: 1.8rem;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: background var(--swift), color var(--swift),
        transform var(--swift);
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn--play {
      width: 2.25rem;
      height: 2.25rem;
      background: #fff;
      color: #000;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .btn--play svg {
      width: 17px;
      height: 17px;
    }

    .i-pause,
    .player.is-playing .i-play {
      display: none;
    }

    .player.is-playing .i-pause {
      display: block;
    }

    .btn--play:hover {
      background: #fff;
      color: #000;
      transform: scale(1.06);
    }

    .btn--play:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    .btn--toggle.is-on {
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
    }

    .list {
      position: absolute;
      bottom: calc(100% + 0.7rem);
      left: 0;
      right: 0;
      z-index: 5;
      max-height: min(48dvh, 24rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      border-radius: 1.35rem;
      border: 1px solid var(--glass-line);
      background: rgba(20, 20, 22, 0.55);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      box-shadow: var(--shadow-glass);
      opacity: 0;
      visibility: hidden;
      transform: translate3d(0, 10px, 0) scale(0.985);
      transform-origin: bottom center;
      transition: opacity var(--glide), transform var(--glide),
        visibility 0s linear 320ms;
    }

    .list.is-open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity var(--glide), transform 420ms var(--ease-settle),
        visibility 0s;
    }

    .list {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
    }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
    }
    .list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .list ol {
      margin: 0;
      padding: 0.4rem;
      list-style: none;
      counter-reset: t;
    }

    .list li {
      counter-increment: t;
    }

    .list button {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.45rem 0.7rem;
      border: none;
      border-radius: 0.7rem;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-family: var(--body);
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .list button::before {
      content: counter(t);
      flex: none;
      width: 1.4rem;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.4);
    }

    .list button:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .list li.is-current button {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-weight: 800;
    }

    .list .t-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list .t-artist {
      font-size: 0.74rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bumper {
      width: 100%;
      margin: 0 auto 0.7rem;
      padding: 0 0.5rem;
      text-align: center;
      user-select: none;
    }

    .bumper__text {
      font-family: "Yatra One", var(--body);
      font-size: clamp(1rem, 2.6vw, 1.28rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.015em;
      text-align: center;
      text-wrap: balance;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: var(--text-shadow);
      transition: opacity 240ms ease;
    }

    .bumper__text.is-swapping {
      opacity: 0;
    }

    .bumper__next {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: -0.22em;
      margin-left: 0.4em;
      width: 1.4rem;
      height: 1.4rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: color var(--swift), background var(--swift),
        rotate 420ms var(--ease-settle);
    }

    .bumper__next:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    .bumper__next:active {
      rotate: 180deg;
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 8px;
    }

    @media (max-width: 640px) {
      :root { --logo-top: 16vh; }
      .presence__label { display: none; }
      .horn {
        padding: 0.28rem 0.6rem 0.28rem 0.28rem;
        gap: 0.4rem;
      }
      .horn__icon { width: 1.5rem; height: 1.5rem; }
      .horn__deva { font-size: 0.72rem; }
      .horn__en { font-size: 0.56rem; }
      .player {
        flex-wrap: wrap;
        padding: 0.75rem;
        border-radius: 1.5rem;
        row-gap: 0.6rem;
      }
      .controls { width: 100%; justify-content: center; gap: 0.35rem; }
      .disc { width: 3.75rem; height: 3.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

    ];

    const $ = (id) => document.getElementById(id);
    const el = {
      player: $('player'), cover: $('cover'), title: $('title'), artist: $('artist'),
      seek: $('seek'), seekFill: $('seekFill'), seekKnob: $('seekKnob'),
      tCur: $('tCur'), tDur: $('tDur'), play: $('play'), prev: $('prev'),
      next: $('next'), shuffle: $('shuffle'), listBtn: $('listBtn'),
      list: $('list'), listItems: $('listItems'), clock: $('clock'),
      listeners: $('listeners'), bumperText: $('bumperText'), bumperNext: $('bumperNext'),
      horn: $('horn'), logo: document.querySelector('.logo'),
    }; 

    const state = {
      tracks: EMBEDDED_TRACKS,
      order: [], pos: 0, shuffle: true, ready: false, playing: false, started: false, scrubbing: false,
    }; 

    let yt = null;

    const fmt = (s) => {
      if (!Number.isFinite(s) || s < 0) s = 0;
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    };

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildOrder() {
      const seq = Array.from({ length: state.tracks.length }, (_, i) => i);
      return state.shuffle ? shuffleArray(seq) : seq;
    }

    const currentTrack = () => state.tracks[state.order[state.pos]];

    let swapTimer = null;
    function renderTrack() {
      const t = currentTrack();
      if (!t) return;
      if (el.title.dataset.rendered) {
        el.player.classList.add('is-swapping');
        clearTimeout(swapTimer);
        swapTimer = setTimeout(() => el.player.classList.remove('is-swapping'), 40);
      }
      el.title.dataset.rendered = '1';
      el.title.textContent = t.title;
      el.artist.textContent = t.artist || t.rawTitle || '';
      el.cover.src = t.cover || '';
      el.cover.alt = `${t.title} artwork`;
      el.cover.classList.toggle('is-letterboxed', (t.cover || '').includes('ytimg.com'));

      if (state.started) document.title = `${t.title} — Truck Wala`;
      [...el.listItems.children].forEach((li, i) => li.classList.toggle('is-current', i === state.pos));
      const active = el.listItems.children[state.pos];
      if (active && el.list.classList.contains('is-open')) {
        active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function renderList() {
      el.listItems.innerHTML = '';
      state.order.forEach((trackIdx, i) => {
        const t = state.tracks[trackIdx];
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        const title = document.createElement('span');
        title.className = 't-title';
        title.textContent = t.title;
        const artist = document.createElement('span');
        artist.className = 't-artist';
        artist.textContent = t.artist || '';
        btn.append(title, artist);
        btn.addEventListener('click', () => go(i));
        li.append(btn);
        el.listItems.append(li);
      });
    }

    const bgLayers = [...document.querySelectorAll('.bg__layer')];
    let bgIndex = 0;

    function rotateBackground(to) {
      if (bgLayers.length === 0) return;
      const n = bgLayers.length;
      bgIndex = (((to ?? bgIndex + 1) % n) + n) % n;
      bgLayers.forEach((layer, i) => layer.classList.toggle('is-active', i === bgIndex));
    }

    function renderPlaying(on) {
      state.playing = on;
      el.player.classList.toggle('is-playing', on);
      el.play.setAttribute('aria-label', on ? 'Pause' : 'Play');
    }

    function go(newPos) {
      const n = state.order.length;
      state.pos = ((newPos % n) + n) % n;
      renderTrack();
      rotateBackground(); // गाना बदलते ही अगली बैकग्राउंड इमेज आ जाएगी
      if (!yt) return;
      state.started = true;
      yt.loadVideoById(currentTrack().id);
    }

    function toggle() {
      if (!yt || !state.ready) return;
      if (state.playing) {
        yt.pauseVideo();
      } else {
        state.started = true;
        yt.playVideo();
      }
    }

    const poll = { at: 0, time: 0, duration: 0 };
    let lastSecond = -1;
    let lastDuration = -1;

    function samplePlayer() {
      if (!yt || typeof yt.getCurrentTime !== 'function') return;
      poll.time = yt.getCurrentTime() || 0;
      poll.duration = yt.getDuration() || 0;
      poll.at = performance.now();
    }

    function paintProgress() {
      requestAnimationFrame(paintProgress);
      if (!yt || state.scrubbing || !poll.duration) return;
      const drift = state.playing ? (performance.now() - poll.at) / 1000 : 0;
      const cur = Math.min(poll.duration, poll.time + drift);
      const frac = Math.min(1, Math.max(0, cur / poll.duration));
      el.seekFill.style.transform = `scaleX(${frac})`;
      el.seekKnob.style.transform = `translate(-50%, -50%) translateX(${frac * el.seek.clientWidth}px)`;

      const second = Math.floor(cur);
      if (second !== lastSecond) {
        lastSecond = second;
        el.tCur.textContent = fmt(cur);
        el.seek.setAttribute('aria-valuenow', String(Math.round(frac * 100)));
      }
      if (poll.duration !== lastDuration) {
        lastDuration = poll.duration;
        el.tDur.textContent = fmt(poll.duration);
      }
    }

    function fractionFromEvent(e) {
      const r = el.seek.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    }

    function previewSeek(frac) {
      el.seekFill.style.transform = `scaleX(${frac})`;
      el.seekKnob.style.transform = `translate(-50%, -50%) translateX(${frac * el.seek.clientWidth}px)`;
      if (yt && typeof yt.getDuration === 'function') {
        el.tCur.textContent = fmt((yt.getDuration() || 0) * frac);
      }
    }

    el.seek.addEventListener('pointerdown', (e) => {
      if (!yt) return;
      state.scrubbing = true;
      el.seek.setPointerCapture(e.pointerId);
      previewSeek(fractionFromEvent(e));
    });
    el.seek.addEventListener('pointermove', (e) => {
      if (state.scrubbing) previewSeek(fractionFromEvent(e));
    });
    el.seek.addEventListener('pointerup', (e) => {
      if (!state.scrubbing) return;
      state.scrubbing = false;
      el.seek.releasePointerCapture(e.pointerId);
      const dur = yt?.getDuration?.() || 0;
      if (dur) yt.seekTo(dur * fractionFromEvent(e), true);
      samplePlayer();
    });

    el.play.addEventListener('click', toggle);
    el.prev.addEventListener('click', () => {
      if (yt && (yt.getCurrentTime() || 0) > 3) yt.seekTo(0, true);
      else go(state.pos - 1);
    });
    el.next.addEventListener('click', () => go(state.pos + 1));
    
    el.shuffle.addEventListener('click', () => {
      const keep = currentTrack();
      state.shuffle = !state.shuffle;
      el.shuffle.classList.toggle('is-on', state.shuffle);
      el.shuffle.setAttribute('aria-pressed', String(state.shuffle));
      state.order = buildOrder();
      state.pos = Math.max(0, state.order.indexOf(state.tracks.indexOf(keep)));
      renderList();
      renderTrack();
    });

    el.listBtn.addEventListener('click', () => {
      const open = !el.list.classList.contains('is-open');
      el.list.classList.toggle('is-open', open);
      el.listBtn.classList.toggle('is-on', open);
      el.listBtn.setAttribute('aria-expanded', String(open));
      if (open) {
        el.listItems.children[state.pos]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea, [contenteditable]')) return;
      if (e.key === ' ' || e.key === 'k') {
        e.preventDefault();
        toggle();
      } else if (e.key === 'n' || e.key === 'ArrowRight') {
        if (e.target !== el.seek) go(state.pos + 1);
      } else if (e.key === 'p' || e.key === 'ArrowLeft') {
        if (e.target !== el.seek) go(state.pos - 1);
      } else if (e.key === 'h') {
        honk();
      }
    });

    let audioCtx = null;
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch {}

    function ensureAudio() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch {
        return null;
      }
    }

    function primeAudio() {
      ensureAudio();
    }
    ['pointerdown', 'keydown'].forEach((evt) => document.addEventListener(evt, primeAudio, { once: true, capture: true }));

    let duckTimer = null;
    let duckedFrom = null;
    function duckMusic(ms) {
      if (!yt || typeof yt.getVolume !== 'function') return;
      if (duckedFrom === null) duckedFrom = yt.getVolume();
      yt.setVolume(Math.round(duckedFrom * 0.4));
      clearTimeout(duckTimer);
      duckTimer = setTimeout(() => {
        if (duckedFrom !== null) yt.setVolume(duckedFrom);
        duckedFrom = null;
      }, ms + 120);
    }

    async function honk() {
      const ctx = ensureAudio();
      if (!ctx) return;
      
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 0.35);
      
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);

      duckMusic(400);

      [
        [el.horn, 'is-blaring', 450],
        [el.logo, 'is-shaking', 720],
      ].forEach(([node, cls, ms]) => {
        if (!node) return;
        node.classList.remove(cls);
        void node.offsetWidth;
        node.classList.add(cls);
        setTimeout(() => node.classList.remove(cls), ms);
      });
    }

    el.horn.addEventListener('click', honk);

    const BUMPER_LINES = [
      'बुरी नज़र वाले तेरा मुँह काला', 'देखो मगर प्यार से', 'ओके टाटा, फिर मिलेंगे', 
      'मेरा भारत महान', 'जय माता दी', 'रब राखा', 'साइड प्लीज़', 'हॉर्न दो, राह लो', 
      'चलती का नाम गाड़ी', 'जो डर गया, समझो मर गया', 'दिल्ली अभी दूर है'
    ];
    let bumperOrder = [];
    let bumperPos = 0;
    let bumperTimer = null;

    function shuffleLines() {
      bumperOrder = shuffleArray(BUMPER_LINES.map((_, i) => i));
    }

    function nextBumper() {
      bumperPos += 1;
      if (bumperPos >= bumperOrder.length) {
        shuffleLines();
        bumperPos = 0;
      }
      el.bumperText.classList.add('is-swapping');
      setTimeout(() => {
        el.bumperText.textContent = BUMPER_LINES[bumperOrder[bumperPos]];
        el.bumperText.classList.remove('is-swapping');
      }, 250);
      clearInterval(bumperTimer);
      bumperTimer = setInterval(nextBumper, 12000);
    }
    shuffleLines();
    el.bumperText.textContent = BUMPER_LINES[bumperOrder[0]];
    bumperTimer = setInterval(nextBumper, 12000);
    el.bumperNext.addEventListener('click', nextBumper);

    function tickClock() {
      el.clock.textContent = new Date()
        .toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })
        .toLowerCase();
    }
    tickClock();
    setInterval(tickClock, 15000);

    (function driftListeners() {
      const MIN = 500;
      const MAX = 800;
      let count = MIN + Math.floor(Math.random() * (MAX - MIN));
      el.listeners.textContent = String(count);
      const step = () => {
        const midpoint = (MIN + MAX) / 2;
        const up = Math.random() < (count < midpoint ? 0.58 : 0.42);
        count = Math.max(MIN, Math.min(MAX, count + (up ? 1 : -1) * (1 + Math.floor(Math.random() * 4))));
        el.listeners.textContent = String(count);
        setTimeout(step, 2500 + Math.random() * 3500);
      };
      setTimeout(step, 2000);
    })();

    function preferAudio() {
      try { yt?.setPlaybackQuality?.('tiny'); } catch {}
    }

    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt-player', {
        height: '1', width: '1',
        videoId: currentTrack().id,
        playerVars: { playsinline: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
        events: {
          onReady: () => {
            state.ready = true;
            el.play.disabled = false;
            preferAudio();
          },
          onStateChange: (e) => {
            const S = YT.PlayerState;
            if (e.data === S.PLAYING) {
              renderPlaying(true);
              preferAudio();
            } else if (e.data === S.PAUSED || e.data === S.BUFFERING) {
              renderPlaying(e.data === S.BUFFERING && state.playing);
            } else if (e.data === S.ENDED) {
              go(state.pos + 1);
            }
          },
          onError: () => {
            if (state.started) go(state.pos + 1);
          },
        },
      });
      setInterval(samplePlayer, 250);
      requestAnimationFrame(paintProgress);
    };

    (function init() {
      if (!state.tracks.length) {
        el.title.textContent = 'No tracks found';
        return;
      }
      state.order = buildOrder();
      renderList();
      renderTrack();
      rotateBackground(0);

      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.append(s);
    })();
  </script>
</body>
</html>
